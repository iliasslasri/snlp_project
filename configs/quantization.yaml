defaults:
  - _self_

dataset:
  root: "LibriSpeech"
  train_split: "train-clean-100"
  valid_split: "dev-clean"
  batch_size: 1 
  num_workers: 1
  augmentations:
    time_stretch: true
    pitch_shift: true
    reverberation: true
    noise: true

model:
  name: "hubert-base-ls960"
  layer: 9
  vocab_size: 500
  kind_kmeans: "kmeans"
  quantizer:
    hidden_dim: 256

training:
  epochs: 10
  learning_rate: 1e-4
  log_interval: 100
  checkpoint_dir: "checkpoints/quantizer"
  resume: false
  iterative_refinement_steps: 0 # set > 0 for iterative training 
