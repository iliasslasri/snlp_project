defaults:
  - _self_

training:
  run_name: "new_aug"
  epochs: 350
  learning_rate: 1e-4
  log_interval: 100
  checkpoint_dir: null
  resume_from: null # Resume from a mid-epoch checkpoint (takes priority over cfg start_round)
  n_iterative_pseudolabeling: 3 # set > 0 for iterative training
  start_round: 0 # start iterative labeling from this round (0-indexed); must be < n_iterative_pseudolabeling
  teacher_checkpoint_path: null # path to E1_best.pt from round (start_round - 1); required when start_round > 0
  lr_scheduler:
    _target_: "torch.optim.lr_scheduler.CosineAnnealingLR"
    T_max: ${training.epochs}
    eta_min: 1e-6
  lr_scheduler_start_epoch: -1

dataset:
  root: "data/LibriSpeech"
  train_split: "train-clean-100"
  test_split: "test-clean"
  batch_size: 32
  num_workers: 1
  noise_dir: "noise_fullband"
  max_audio_length: 160000  # 10s at 16kHz
  augmentations:
    max_augs: 4  # number of augmentations to apply per sample; we sample k ~ Uniform(0, n_aug) augmentations to apply per sample
    time_stretch: true
    pitch_shift: true
    reverberation: true
    noise: true
    rir_dir: "data/rirs"
    activate_extra_augs: true

    echo:
      enabled: true
      volume_range: [0.1, 0.5]
      duration_range: [0.1, 0.5]
    random_noise:
      enabled: true
      noise_std: 0.001
    pink_noise:
      enabled: true
      noise_std: 0.01
    lowpass_filter:
      enabled: true
      cutoff_freq: 5000
    highpass_filter:
      enabled: true
      cutoff_freq: 500
    bandpass_filter:
      enabled: true
      cutoff_freq_low: 300
      cutoff_freq_high: 8000
    smooth:
      enabled: true
      window_size_range: [2, 10]
    boost_audio:
      enabled: true
      amount: 20
    duck_audio:
      enabled: true
      amount: 20
    updownresample:
      enabled: true
      intermediate_freq: 32000

model:
  name: "hubert-base-ls960"
  layer: 6
  vocab_size: 500
  kind_kmeans: "kmeans"
  quantizer:
    hidden_dim: 256

hydra:
  run:
    dir: outputs/${training.run_name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
