defaults:
  - _self_

dataset:
  root: "LibriSpeech"
  train_split: "data/LibriSpeech/train-clean-100"
  test_split: "data/LibriSpeech/test-clean"
  batch_size: 16 
  num_workers: 1
  noise_dir: "noise_fullband"
  augmentations:
    time_stretch: true
    pitch_shift: true
    reverberation: true
    noise: true

model:
  name: "hubert-base-ls960"
  layer: 9
  vocab_size: 500
  kind_kmeans: "kmeans"
  quantizer:
    hidden_dim: 256

training:
  epochs: 150
  learning_rate: 1e-4
  log_interval: 100
  checkpoint_dir: "checkpoints/quantizer"
  resume_from: null
  iterative_refinement_steps: 0 # set > 0 for iterative training
  lr_scheduler:
    _target_: "torch.optim.lr_scheduler.CosineAnnealingLR"
    T_max: 50
    eta_min: 1e-6
  lr_scheduler_start_epoch: 100