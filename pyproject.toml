[project]
name = "snlp-project"
version = "0.1.0"
description = "Robust speech representation learning"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "aiohttp>=3.13.3",
  "huggingface-hub>=1.3.0,<2.0",
  "hydra-core>=1.3.0",
  "jaxtyping>=0.3.9",
  "librosa>=0.10.0",
  "numpy<2.0.0",
  "omegaconf>=2.3.0",
  "pandas>=2.0.0",
  "requests>=2.32.5",
  "scipy>=1.12.0",
  "setuptools<70.0",
  "soundfile>=0.12.0",
  "tensorboard>=2.16.0",
  "torch>=2.1.2",
  "torchaudio>=2.1.2",
  "transformers>=4.30.0",
  "pyroomacoustics",
  "julius",
  "joblib>=1.5.3",
  "fsspec>=2026.2.0",
  "scikit-learn>=1.8.0",
  "editdistance>=0.8.1",
]

[dependency-groups]
dev = [
  "ipykernel>=7.2.0",
  "ruff>=0.15.0",
]
eval = [
  "fastabx",
]

[tool.uv.sources]
# Install fastabx from the local git submodule (already cloned in fastabx/)
fastabx = { path = "fastabx", editable = true }
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["flit_core>=3.2,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "src"

[tool.ruff]
line-length = 119

[tool.ruff.lint]
preview = true
select = [
  "A",     # flake8-builtins
  "ARG",   # flake8-unused-arguments
  "B",     # flake8-bugbear
  "C4",    # flake8-comprehensions
  "E",     # pycodestyle error
  "F",     # Pyflakes
  "I",     # isort
  "N",     # pep8-naming
  "PERF",  # Perflint
  "PIE",   # flake8-pie
  "RUF",   # Ruff-specific rules
  "SIM",   # flake8-simplify
  "UP",    # pyupgrade
  "W",     # pycodestyle warning
]
